# Nginx config for image-uploader behind domain bartsthriftstores.ie
# App container is exposed on host port 8008.
# Public path: /api/media/images/* on www host only.
# Main website is proxied to a separate local port.

server {
    listen 80;
    listen [::]:80;
    server_name bartsthriftstore.ie;

    # Lets Encrypt HTTP challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.bartsthriftstore.ie$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.bartsthriftstore.ie;

    # Lets Encrypt HTTP challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bartsthriftstore.ie;

    # Redirect apex domain to canonical www host.
    ssl_certificate /etc/letsencrypt/live/bartsthriftstore.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bartsthriftstore.ie/privkey.pem;

    return 301 https://www.bartsthriftstore.ie$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bartsthriftstore.ie;

    # Replace these with certbot-managed certificate paths for your server.
    ssl_certificate /etc/letsencrypt/live/bartsthriftstore.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bartsthriftstore.ie/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Keep request sizes aligned with API upload limit.
    client_max_body_size 10M;

    # Health endpoint for image-uploader.
    location = /api/media/images/health {
        proxy_pass http://127.0.0.1:8008/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Image-uploader is exposed only under this path prefix.
    # Examples:
    # - /api/media/images/folder/file.jpg      -> /images/folder/file.jpg
    # - /api/media/images/list/folder          -> /images/list/folder
    location /api/media/images/ {
        proxy_pass http://127.0.0.1:8008/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Forward everything else to the main website app.
    # Change 8080 to whatever port your main site is listening on.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
