name: Deploy Image Uploader

on:
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-image-uploader.yml"
  workflow_dispatch:

concurrency:
  group: deploy-image-uploader-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy repo files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".github,src,Dockerfile,docker-compose.yml,package.json,package-lock.json,tsconfig.json"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          rm: false
          strip_components: 0

      - name: Write production .env on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          PUBLIC_IMAGES_PATH: ${{ secrets.PUBLIC_IMAGES_PATH }}
          UPLOADS_PATH: ${{ secrets.UPLOADS_PATH }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          MAX_FILE_SIZE_MB: ${{ secrets.MAX_FILE_SIZE_MB }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: API_SECRET,BASE_URL,PUBLIC_IMAGES_PATH,UPLOADS_PATH,HOST_PORT,MAX_FILE_SIZE_MB
          script_stop: true
          script: |
            set -eu
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            cat > "${{ secrets.DEPLOY_PATH }}/.env" <<EOF
            API_SECRET=${API_SECRET}
            BASE_URL=${BASE_URL}
            PUBLIC_IMAGES_PATH=${PUBLIC_IMAGES_PATH}
            UPLOADS_PATH=${UPLOADS_PATH}
            HOST_PORT=${HOST_PORT}
            MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB}
            EOF

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          PUBLIC_IMAGES_PATH: ${{ secrets.PUBLIC_IMAGES_PATH }}
          UPLOADS_PATH: ${{ secrets.UPLOADS_PATH }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          MAX_FILE_SIZE_MB: ${{ secrets.MAX_FILE_SIZE_MB }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: API_SECRET,BASE_URL,PUBLIC_IMAGES_PATH,UPLOADS_PATH,HOST_PORT,MAX_FILE_SIZE_MB
          script_stop: true
          script: |
            set -euxo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            API_SECRET="$API_SECRET" \
            BASE_URL="$BASE_URL" \
            PUBLIC_IMAGES_PATH="$PUBLIC_IMAGES_PATH" \
            UPLOADS_PATH="$UPLOADS_PATH" \
            HOST_PORT="$HOST_PORT" \
            MAX_FILE_SIZE_MB="$MAX_FILE_SIZE_MB" \
            docker compose up -d --build image-uploader

            docker compose ps
