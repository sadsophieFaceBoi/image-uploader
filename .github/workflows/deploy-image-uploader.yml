name: Deploy Image Uploader

on:
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-image-uploader.yml"
  workflow_dispatch:

concurrency:
  group: deploy-image-uploader-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"

          grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----' "$key_file"
          ssh-keygen -y -f "$key_file" > /dev/null 2>&1

      - name: Deploy on server over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GIT_DEPLOY_KEY: ${{ secrets.GIT_DEPLOY_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          UPLOADS_PATH: ${{ secrets.UPLOADS_PATH }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          MAX_FILE_SIZE_MB: ${{ secrets.MAX_FILE_SIZE_MB }}
        run: |
          set -euo pipefail

          runner_key="$(mktemp)"
          trap 'rm -f "$runner_key"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$runner_key"
          chmod 600 "$runner_key"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

          ssh -i "$runner_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$GIT_DEPLOY_KEY" > "$HOME/.ssh/github_deploy_key"
          chmod 600 "$HOME/.ssh/github_deploy_key"

          if ! ssh-keygen -F github.com > /dev/null; then
            ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"
          fi

          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/github_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            git clone --branch "$DEPLOY_BRANCH" "git@github.com:$GITHUB_REPOSITORY.git" "$DEPLOY_PATH"
          else
            git -C "$DEPLOY_PATH" fetch --all --prune
            git -C "$DEPLOY_PATH" checkout "$DEPLOY_BRANCH"
            git -C "$DEPLOY_PATH" reset --hard "origin/$DEPLOY_BRANCH"
          fi

          cat > "$DEPLOY_PATH/.env" <<ENVEOF
          API_SECRET=${API_SECRET}
          BASE_URL=${BASE_URL}
          UPLOADS_PATH=${UPLOADS_PATH}
          HOST_PORT=${HOST_PORT}
          MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB}
          ENVEOF

          cd "$DEPLOY_PATH"
          docker compose up -d --build image-uploader
          docker compose ps
          EOF
